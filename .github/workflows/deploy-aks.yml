# Reference workflow for the AKS deployment path (compute_target = "aks").
# Manual-trigger only. Used by customer environments that deploy to AKS via the
# Terraform in infra/terraform. The active deployment for this repo is
# deploy.yml (Azure Container Apps).
name: Build and deploy to AKS (reference)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE: cibil-extractor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            --file Dockerfile .

      - name: Get AKS credentials
        run: az aks get-credentials -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.AKS_NAME }}" --admin --overwrite-existing

      - name: Deploy to AKS
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          DI_ENDPOINT: ${{ vars.DI_ENDPOINT }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          FOUNDRY_DEPLOYMENT: ${{ vars.FOUNDRY_DEPLOYMENT }}
          FOUNDRY_API_VERSION: ${{ vars.FOUNDRY_API_VERSION }}
          FOUNDRY_REGION: ${{ vars.FOUNDRY_REGION }}
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          envsubst < deploy/k8s/app.yaml | kubectl apply -f -
          kubectl -n cibil rollout status deploy/cibil-extractor --timeout=240s
          echo "### Service" >> "$GITHUB_STEP_SUMMARY"
          kubectl -n cibil get svc cibil-extractor -o wide >> "$GITHUB_STEP_SUMMARY"

      - name: Show public IP
        run: |
          IP=$(kubectl -n cibil get svc cibil-extractor -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "App URL: http://$IP" >> "$GITHUB_STEP_SUMMARY"
